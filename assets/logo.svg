<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <!-- Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Fold Corner Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Amber Spark Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Soft Shadow for Paper -->
    <filter id="paperShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="#6366F1" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- Subtle Background Grid Nodes (Graph & Citations Symbol) -->
  <g opacity="0.18">
    <circle cx="100" cy="110" r="4" fill="#38BDF8"/>
    <circle cx="420" cy="130" r="4" fill="#818CF8"/>
    <circle cx="80" cy="400" r="4" fill="#818CF8"/>
    <circle cx="430" cy="390" r="4" fill="#34D399"/>
    <line x1="100" y1="110" x2="160" y2="170" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="420" y1="130" x2="350" y2="190" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="80" y1="400" x2="140" y2="350" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="430" y1="390" x2="360" y2="340" stroke="#34D399" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  <!-- Document / Academic Paper Base -->
  <g filter="url(#paperShadow)">
    <!-- Main Sheet -->
    <path d="M 140 100 
             L 310 100 
             L 380 170 
             L 380 410 
             A 18 18 0 0 1 362 428 
             L 158 428 
             A 18 18 0 0 1 140 410 
             Z" 
          fill="url(#paperGrad)"/>

    <!-- Folded Corner -->
    <path d="M 310 100 
             L 310 160 
             A 10 10 0 0 0 320 170 
             L 380 170 
             Z" 
          fill="url(#foldGrad)"/>
  </g>

  <!-- Header Lines on Paper -->
  <rect x="180" y="145" width="105" height="10" rx="5" fill="#4F46E5"/>
  <rect x="180" y="170" width="70" height="7" rx="3.5" fill="#94A3B8"/>

  <!-- Content Representation (Left Bracket '{' in Cyan) -->
  <text x="170" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="105" font-weight="900" fill="url(#cyanGrad)" filter="url(#glow)">{</text>

  <!-- Structured JSON / Vector Embeddings Lines (Middle) -->
  <g transform="translate(216, 222)">
    <!-- Key: Value Lines -->
    <rect x="0" y="8" width="34" height="6" rx="3" fill="#6366F1"/>
    <rect x="42" y="8" width="48" height="6" rx="3" fill="#0284C7"/>

    <rect x="0" y="24" width="28" height="6" rx="3" fill="#6366F1"/>
    <rect x="36" y="24" width="56" height="6" rx="3" fill="#10B981"/>

    <rect x="0" y="40" width="38" height="6" rx="3" fill="#6366F1"/>
    <rect x="46" y="40" width="40" height="6" rx="3" fill="#0284C7"/>

    <!-- Mini Vector Matrix Dots -->
    <g transform="translate(0, 56)" fill="#818CF8">
      <circle cx="10" cy="5" r="3"/>
      <circle cx="26" cy="5" r="3"/>
      <circle cx="42" cy="5" r="3"/>
      <circle cx="58" cy="5" r="3"/>
      <circle cx="74" cy="5" r="3"/>
    </g>
  </g>

  <!-- Content Representation (Right Bracket '}' in Cyan) -->
  <text x="312" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="105" font-weight="900" fill="url(#cyanGrad)" filter="url(#glow)">}</text>

  <!-- Bottom Paper Feature Badge (Fast Extraction Pill) -->
  <g transform="translate(180, 360)">
    <rect width="160" height="36" rx="18" fill="#1E293B"/>
    <!-- Small Lightning Bolt Icon -->
    <path d="M 22 10 L 15 20 L 21 20 L 17 28 L 26 17 L 20 17 Z" fill="#FBBF24"/>
    <text x="34" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#F8FAFC" letter-spacing="1">ARXIV JSON</text>
  </g>

  <!-- AI Intelligence Spark (Top Right Floating) -->
  <g transform="translate(390, 85)" filter="url(#glow)">
    <path d="M 25 0 Q 25 25 50 25 Q 25 25 25 50 Q 25 25 0 25 Q 25 25 25 0 Z" fill="url(#amberGrad)"/>
    <circle cx="25" cy="25" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Small Secondary Sparkle -->
  <g transform="translate(110, 240)">
    <path d="M 12 0 Q 12 12 24 12 Q 12 12 12 24 Q 12 12 0 12 Q 12 12 12 0 Z" fill="#38BDF8" opacity="0.8"/>
  </g>
</svg>
